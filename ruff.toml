line-length = 120
target-version = "py311"

extend-exclude = [".venv", "venv", "build", "dist", "node_modules", "tests/_obsolete", "**/__pycache__"]

[lint]
select = [
    "E9",   # syntax errors
    "F63",  # broken comparisons
    "F7",   # import/annotation syntax
    "F82",  # undefined name
    "F403", # star-import
    "F811", # redefined-while-unused
    "W6",   # deprecated syntax
    "B",    # bugbear (real bugs)
]
# B904/B005/B023/B905 are per-site judgment calls (ratcheted in scripts/lint_ratchet.py);
# B008 is the FastAPI Depends() idiom; B027 is a benign empty base method.
ignore = ["B904", "B005", "B008", "B023", "B905", "B027"]

[lint.per-file-ignores]
"tests/*" = ["F811", "B"]
"conftest.py" = ["F811"]
