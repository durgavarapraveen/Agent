[mypy]
python_version = 3.11
ignore_missing_imports = True
follow_imports = silent
warn_unused_ignores = False
show_error_codes = True
# Lenient: catch real type errors (call-arg, attr-defined, return-value),
# not missing annotations. Tighten per-package as debt is burned down.
disallow_untyped_defs = False
check_untyped_defs = False
exclude = (^|/)(\.venv|build|dist|node_modules|__pycache__|tests/_obsolete)/
