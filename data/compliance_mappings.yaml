GDPR:
  - control: "Art. 32 - Security of Processing"
    finding_types: ["Open S3 Bucket", "No Encryption", "Weak Password", "SQLI", "RCE"]
  - control: "Art. 33 - Breach Notification"
    finding_types: ["Data Leak", "Exposed PII", "LFI", "INFO_DISCLOSURE"]
HIPAA:
  - control: "164.312(a) - Access Control"
    finding_types: ["Weak Authentication", "Default Credentials", "AUTH", "MISCONFIGURATION"]
  - control: "164.312(e) - Encryption"
    finding_types: ["Missing TLS", "HTTP Not HTTPS", "HEADER", "NO_ENCRYPTION"]
PCI-DSS:
  - control: "Requirement 3.2 - Protect Cardholder Data"
    finding_types: ["Credit Card in Logs", "No Encryption", "EXPOSED_PII"]
  - control: "Requirement 6.6 - WAF/Code Review"
    finding_types: ["SQLI", "XSS", "RCE", "LFI"]
ISO-27001:
  - control: "A.12.6.1 - Management of Technical Vulnerabilities"
    finding_types: ["Outdated Software", "Missing Patch", "SQLI", "RCE"]
  - control: "A.9.4.2 - Secure Log-on Procedures"
    finding_types: ["Default Credentials", "No MFA", "AUTH"]
