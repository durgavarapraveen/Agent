name: CI

on:
  push:
    branches: [main, autonous-agent]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-syntax:
    name: Lint + syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install core deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install psycopg2-binary python-dotenv httpx pydantic pyyaml \
                       cryptography jinja2 prometheus-client

      - name: Byte-compile every module
        run: |
          python -m compileall -q core agents ui/api main.py

      - name: Ruff (style + basic bug checks)
        run: |
          ruff check --output-format=github .

  unit-tests:
    name: Pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ci_pw
          POSTGRES_USER: ci_user
          POSTGRES_DB: ci_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: ci_db
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_pw
      ANTIGRAVITY_ENV: development
      API_KEY: ci-test-key-do-not-use
      ENCRYPTION_KEY_DEV_UNSAFE: "1"
      FP_MODEL_MIN_ROWS: "9999"
      LOG_LEVEL: WARNING

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov slowapi prometheus-client

      - name: Run pytest with coverage (gate at 40%)
        run: |
          pytest --cov=core --cov=agents --cov=ui --cov-report=term-missing \
                 --cov-fail-under=40 --maxfail=5 -q

  sbom:
    name: SBOM + dep audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generate SBOM (CycloneDX)
        run: |
          pip install cyclonedx-bom
          cyclonedx-py requirements requirements.txt -o sbom-python.xml || true

      - name: pip-audit
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --strict -r requirements.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom
          path: |
            sbom-python.xml

  docker-build:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: false
          load: true
          tags: antigravity-web:ci
          build-args: |
            ANTIGRAVITY_WITH_DOCKER_CLI=0

      - name: Build Kali image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: antigravity-kali:ci

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: antigravity-web:ci
          format: table
          exit-code: "0"           # advisory, not fail
          severity: CRITICAL,HIGH

  digest-drift-check:
    name: Kali digest drift
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Check pinned digest is still current
        run: |
          bash scripts/pin_kali_digest.sh --check
