name: "AntiGravity Security Scan"
description: "Run an AntiGravity autonomous pentest, upload SARIF, comment on the PR, and fail on severity threshold."
author: "AntiGravity"

inputs:
  target:
    description: "Target URL to scan (e.g. https://staging.example.com)."
    required: true
  tier:
    description: "Scan tier: POC | SHALLOW | DEEP."
    required: false
    default: "POC"
  phases:
    description: "Comma-separated phases to run (empty = all)."
    required: false
    default: ""
  fail-on:
    description: "Fail the job if any finding is at or above this severity (info|low|medium|high|critical)."
    required: false
    default: "high"
  scan-id:
    description: "Stable scan id (used for artifact paths)."
    required: false
    default: "ci"
  auth-token:
    description: "Optional bearer token for authenticated scans (pass from a GitHub Secret)."
    required: false
    default: ""

outputs:
  sarif-file:
    description: "Path to the generated SARIF file."
    value: ${{ steps.scan.outputs.sarif-file }}
  gate:
    description: "PASS or FAIL."
    value: ${{ steps.scan.outputs.gate }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      shell: bash
      run: pip install -r "${{ github.action_path }}/../../../requirements.txt"

    - name: Run AntiGravity scan (non-interactive)
      id: scan
      shell: bash
      env:
        AUTH_TOKEN: ${{ inputs.auth-token }}
        ANTIGRAVITY_ENV: ci
      run: |
        set -o pipefail
        python scripts/ci_scan.py \
          --target "${{ inputs.target }}" \
          --tier "${{ inputs.tier }}" \
          --phases "${{ inputs.phases }}" \
          --scan-id "${{ inputs.scan-id }}" \
          --fail-on "${{ inputs.fail-on }}" \
          --sarif-out "antigravity.sarif" \
          --json-out "antigravity-findings.json" | tee ci_scan.log
        echo "sarif-file=antigravity.sarif" >> "$GITHUB_OUTPUT"
        if grep -q "PASS:" ci_scan.log; then echo "gate=PASS" >> "$GITHUB_OUTPUT"; else echo "gate=FAIL" >> "$GITHUB_OUTPUT"; fi
      continue-on-error: true

    - name: Upload SARIF to code scanning
      if: always() && hashFiles('antigravity.sarif') != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: antigravity.sarif

    - name: Comment finding summary on PR
      if: always() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let summary = 'AntiGravity scan completed.';
          try {
            const data = JSON.parse(fs.readFileSync('antigravity-findings.json', 'utf8'));
            const s = data.summary || {};
            summary = `### 🛰️ AntiGravity Security Scan — ${s.gate || 'DONE'}\n` +
                      `**Total findings:** ${s.total ?? 0} · **Max severity:** ${s.max_severity ?? 'none'} · ` +
                      `**Fail-on:** ${s.fail_on ?? 'high'}\n\n` +
                      '```json\n' + JSON.stringify(s.counts || {}, null, 2) + '\n```';
          } catch (e) { summary += ` (summary unavailable: ${e})`; }
          await github.rest.issues.createComment({
            owner: context.repo.owner, repo: context.repo.repo,
            issue_number: context.issue.number, body: summary,
          });

    - name: Enforce severity gate
      if: steps.scan.outputs.gate == 'FAIL'
      shell: bash
      run: |
        echo "::error::AntiGravity gate FAILED — findings at or above '${{ inputs.fail-on }}'."
        exit 1
