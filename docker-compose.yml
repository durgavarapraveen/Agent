services:

  # ==========================================================
  # AntiGravity Web — API + React frontend
  # ==========================================================

  web:
    build:
      context: .
      dockerfile: Dockerfile.web

    container_name: antigravity-web
    hostname: web

    environment:
      PYTHONUNBUFFERED: "1"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: pentesting_db
      POSTGRES_USER: pentesting_user
      POSTGRES_PASSWORD: pentesting_password
      DATABASE_URL: postgresql://pentesting_user:pentesting_password@postgres:5432/pentesting_db
      KALI_CONTAINER: kali-pentesting
      API_PORT: "8900"
      API_HOST: "0.0.0.0"

    # Pass LLM / integration API keys through to the container.
    # File missing → all vars default to blank; startup continues.
    env_file:
      - path: .env
        required: false

    ports:
      - "8900:8900"

    volumes:
      # P0.10: docker.sock mount REMOVED — container escape risk.
      # Kali container reached via Docker network, not socket.
      - pentesting_reports:/app/reports
      - pentesting_data:/app/data

    networks:
      - pentesting

    depends_on:
      postgres:
        condition: service_healthy
      kali:
        condition: service_started

    restart: unless-stopped

    cpus: "2.0"
    mem_limit: 2g

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================
  # Comprehensive Kali Cybersecurity Container
  # ==========================================================

  kali:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: kali-pentesting
    hostname: kali-pentesting

    # Run tini as PID 1 so killed tools (nuclei/ffuf on timeout) are reaped
    # instead of piling up as zombie processes inside the container.
    init: true

    working_dir: /pentesting

    environment:
      PYTHONUNBUFFERED: "1"

      # PostgreSQL
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: pentesting_db
      POSTGRES_USER: pentesting_user
      POSTGRES_PASSWORD: pentesting_password

      DATABASE_URL: postgresql://pentesting_user:pentesting_password@postgres:5432/pentesting_db

    # LLM / integration keys propagated in; missing file is not fatal.
    env_file:
      - path: .env
        required: false

    volumes:
      # Project source
      - .:/pentesting

      # Persistent data
      - pentesting_data:/pentesting/data
      - pentesting_reports:/pentesting/reports
      - pentesting_logs:/pentesting/logs
      - pentesting_loot:/pentesting/loot

    networks:
      - pentesting

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

    # Security — nmap, masscan, etc. need raw sockets
    cap_add:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - seccomp=unconfined

    # Resource limits
    cpus: "4.0"
    mem_limit: 6g

    stdin_open: true
    tty: true

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ==========================================================
  # Primary PostgreSQL Database + pgvector
  # ==========================================================

  postgres:
    image: pgvector/pgvector:pg16

    container_name: pentesting-postgres
    hostname: postgres

    environment:
      POSTGRES_DB: pentesting_db
      POSTGRES_USER: pentesting_user
      POSTGRES_PASSWORD: pentesting_password

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    networks:
      - pentesting

    restart: unless-stopped

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U pentesting_user -d pentesting_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

# ============================================================
# Network
# ============================================================

networks:
  pentesting:
    driver: bridge

# ============================================================
# Persistent volumes
# ============================================================

volumes:

  pgdata:

  pentesting_data:

  pentesting_reports:

  pentesting_logs:

  pentesting_loot:

