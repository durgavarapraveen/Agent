services:

  # ==========================================================
  # Comprehensive Kali Cybersecurity Container
  # ==========================================================

  kali:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: kali-pentesting
    hostname: kali-pentesting

    working_dir: /pentesting

    environment:
      PYTHONUNBUFFERED: "1"

      # PostgreSQL
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: pentesting_db
      POSTGRES_USER: pentesting_user
      POSTGRES_PASSWORD: pentesting_password

      DATABASE_URL: postgresql://pentesting_user:pentesting_password@postgres:5432/pentesting_db

    volumes:
      # Project source
      - .:/pentesting

      # Persistent data
      - pentesting_data:/pentesting/data
      - pentesting_reports:/pentesting/reports
      - pentesting_logs:/pentesting/logs
      - pentesting_loot:/pentesting/loot

    networks:
      - pentesting

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

    # Resource limits
    cpus: "4.0"
    mem_limit: 6g

    stdin_open: true
    tty: true

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ==========================================================
  # Primary PostgreSQL Database + pgvector
  # ==========================================================

  postgres:
    image: pgvector/pgvector:pg16

    container_name: pentesting-postgres
    hostname: postgres

    environment:
      POSTGRES_DB: pentesting_db
      POSTGRES_USER: pentesting_user
      POSTGRES_PASSWORD: pentesting_password

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    networks:
      - pentesting

    restart: unless-stopped

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U pentesting_user -d pentesting_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

# ============================================================
# Network
# ============================================================

networks:
  pentesting:
    driver: bridge

# ============================================================
# Persistent volumes
# ============================================================

volumes:

  pgdata:

  pentesting_data:

  pentesting_reports:

  pentesting_logs:

  pentesting_loot:
