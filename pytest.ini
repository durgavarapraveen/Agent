[pytest]
minversion = 7.0
testpaths = tests
norecursedirs = _obsolete .venv .git __pycache__ node_modules
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --strict-config
markers =
    slow: marks tests as slow (deselect with `-m "not slow"`)
    integration: exercises Postgres / Kali / external services
    security: security-critical behaviour that MUST NOT regress
filterwarnings =
    ignore::DeprecationWarning
asyncio_mode = auto
